<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>フォント比較</title>
<style>body{margin:0;font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f5f9;color:#14213d}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#14213d;position:sticky;top:0;z-index:2}
nav button{border:1px solid #fff5;background:transparent;color:#fff;padding:8px 14px;font-size:14px;font-weight:700;border-radius:4px;cursor:pointer}
nav button.on{background:#c8243c;border-color:#c8243c}
p{margin:0;padding:8px 16px;font-size:13px;background:#fff;border-bottom:1px solid #dde}
iframe{display:block;width:100%;height:calc(100vh - 92px);border:0;background:#fff}</style></head><body>
<nav><button data-k="cur">現行</button><button data-k="A">A 明朝で格式</button><button data-k="B">B 極太ゴシック</button><button data-k="AC" class="on">A＋C 明朝＋数字強調（おすすめ）</button></nav>
<p id="d"></p><iframe id="f" src="AC.html" title="プレビュー"></iframe>
<script>const D={cur:"今のフォント（Zen Kaku Gothic New）",A:"見出しを太い明朝体に。経済誌のような格式",B:"見出しを最も太いゴシックに。勢いと力強さ",AC:"明朝の見出し＋日付・定員・満足度の数字を大きく"};
const f=document.getElementById("f"),d=document.getElementById("d");d.textContent=D.AC;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");f.src=b.dataset.k+".html";d.textContent=D[b.dataset.k]});</script></body></html>
